name: Build & release

# To release: bump "version" in package.json, then Actions → Build & release →
# Run workflow with "Publish a release" ticked (or push a tag like v1.0.1).
# Run it without the tick for a test build that publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (version from package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          for APP in "release/mac-arm64/Supertitle Cuer.app" "release/mac/Supertitle Cuer.app"; do
            codesign --verify --deep --strict "$APP"
            plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$APP/Contents/Info.plist" | grep -qx supertitles
            echo "::notice::$(basename "$(dirname "$APP")"): signature OK (ad-hoc), .supertitles registered, $(lipo -archs "$APP/Contents/MacOS/Supertitle Cuer")"
          done
          APP="release/mac-arm64/Supertitle Cuer.app"
          "$APP/Contents/MacOS/Supertitle Cuer" &
          sleep 20
          pgrep -f "Supertitle Cuer.app/Contents/MacOS" >/dev/null && echo "::notice::Mac app launched and kept running"
          pkill -f "Supertitle Cuer.app/Contents/MacOS" || true
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB)) MB)"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep 5
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Supertitle Cuer.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$app) { Write-Host "::error::App not found after install"; Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          Write-Host "::notice::Windows installer OK: installed to $($app.FullName)"
          $keys = 'HKCU:\Software\Classes\.supertitles','HKLM:\Software\Classes\.supertitles','Registry::HKEY_CLASSES_ROOT\.supertitles'
          $assoc = $null; foreach ($k in $keys) { if (Test-Path $k) { $assoc = (Get-Item $k).GetValue(''); if ($assoc) { break } } }
          if (!$assoc) { Write-Host "::error::.supertitles file type not registered"; exit 1 }
          Write-Host "::notice::.supertitles files open with: $assoc"
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { Write-Host "::error::App exited early (code $($p.ExitCode))"; exit 1 }
          Write-Host '::notice::Windows app launched and kept running'
          Stop-Process -Id $p.Id -Force
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:html
      - run: cp docs/Supertitle_Cuer_Manual.pdf dist/
      - uses: actions/upload-artifact@v4
        with:
          name: app-html
          path: |
            dist/Supertitle_Cuer.html
            dist/Supertitle_Cuer_Manual.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [build, html]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: app-*
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Supertitle Cuer ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          make_latest: ${{ contains(steps.v.outputs.version, '-') && 'false' || 'true' }}
          files: out/*
          body: |
            ### Install

            **Mac (Homebrew)**
            ```
            brew install --cask poetic-pixie/tap/supertitle-cuer
            ```
            Or download the `.dmg` for your Mac (`arm64` = Apple Silicon M1/M2/M3/M4, `x64` = Intel), drag the app to Applications, then run once in Terminal:
            ```
            xattr -dr com.apple.quarantine "/Applications/Supertitle Cuer.app"
            ```

            **Windows**
            Download `Supertitle_Cuer-Setup-….exe` and run it. If Windows shows “Windows protected your PC”, click **More info → Run anyway**.

            **No install (any computer with Chrome)**
            Download `Supertitle_Cuer.html` and double-click it.

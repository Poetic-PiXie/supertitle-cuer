name: Build & release

# Tags and explicit workflow runs publish new versions. The audited 2.9.5
# source upload also publishes once when pushed to main. Existing releases
# always retain their assets and notes. Uploads remain draft until verified.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
      - scripts/verify-release-inputs.cjs
      - build/release-2.9.5-manifest.json
      - RELEASE-NOTES-2.9.5.md
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (version from package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$EVENT_REF" == refs/tags/v* ]]; then
            [[ "$EVENT_REF" == "refs/tags/v$version" ]] || { echo '::error::Tag must match package version'; exit 1; }
            publish=true
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_PUBLISH" == true ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/heads/main && "$version" == 2.9.5 ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            platform: win
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify audited source inputs
        if: needs.prepare.outputs.version == '2.9.5'
        run: node scripts/verify-release-inputs.cjs source
      - run: npm test
      - run: npm run test:electron
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify audited packaged runtime
        if: needs.prepare.outputs.version == '2.9.5'
        run: node scripts/verify-release-inputs.cjs package ${{ matrix.platform }}
      - name: Verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          for APP in "release/mac-arm64/Supertitle Cuer.app" "release/mac/Supertitle Cuer.app"; do
            codesign --verify --deep --strict "$APP"
            plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$APP/Contents/Info.plist" | grep -qx supertitles
            echo "::notice::$(basename "$(dirname "$APP")"): signature OK (ad-hoc), .supertitles registered, $(lipo -archs "$APP/Contents/MacOS/Supertitle Cuer")"
          done
          if [[ "$(node -p process.arch)" == arm64 ]]; then
            APP="release/mac-arm64/Supertitle Cuer.app"
          else
            APP="release/mac/Supertitle Cuer.app"
          fi
          "$APP/Contents/MacOS/Supertitle Cuer" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 20
          kill -0 "$app_pid" 2>/dev/null || { echo '::error::Mac app exited early'; exit 1; }
          echo '::notice::Mac app launched and kept running'
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB)) MB)"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep 5
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Supertitle Cuer.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$app) { Write-Host "::error::App not found after install"; Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          Write-Host "::notice::Windows installer OK: installed to $($app.FullName)"
          $keys = 'HKCU:\Software\Classes\.supertitles','HKLM:\Software\Classes\.supertitles','Registry::HKEY_CLASSES_ROOT\.supertitles'
          $assoc = $null; foreach ($k in $keys) { if (Test-Path $k) { $assoc = (Get-Item $k).GetValue(''); if ($assoc) { break } } }
          if (!$assoc) { Write-Host "::error::.supertitles file type not registered"; exit 1 }
          Write-Host "::notice::.supertitles files open with: $assoc"
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { Write-Host "::error::App exited early (code $($p.ExitCode))"; exit 1 }
          Write-Host '::notice::Windows app launched and kept running'
          Stop-Process -Id $p.Id -Force
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  html:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify audited source inputs
        if: needs.prepare.outputs.version == '2.9.5'
        run: node scripts/verify-release-inputs.cjs source
      - run: npm test
      - run: npm run build:html
      - name: Verify audited standalone HTML
        if: needs.prepare.outputs.version == '2.9.5'
        run: node scripts/verify-release-inputs.cjs html
      - run: cp docs/Supertitle_Cuer_Manual.pdf dist/
      - uses: actions/upload-artifact@v4
        with:
          name: app-html
          path: |
            dist/Supertitle_Cuer.html
            dist/Supertitle_Cuer_Manual.pdf
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, html]
    concurrency:
      group: release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Preserve an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote("v" + os.environ["VERSION"], safe=""))')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          http_status="$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$response" --write-out '%{http_code}' \
            "$API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          case "$http_status" in
            200)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo "::notice::Release v$VERSION already exists; keeping its assets and notes unchanged."
              ;;
            404)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not check release v$VERSION (HTTP $http_status); refusing to publish."
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          path: out
          pattern: app-*
          merge-multiple: true
      - name: Checksums
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          (cd out && sha256sum * > SHA256SUMS.txt)
          node scripts/verify-release-inputs.cjs assets out
      - id: draft
        uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Supertitle Cuer ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          make_latest: false
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: RELEASE-NOTES-${{ steps.v.outputs.version }}.md
          files: out/*
      - name: Verify uploaded draft, then publish
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > uploaded-release.json
          node scripts/verify-release-inputs.cjs remote out uploaded-release.json "$RELEASE_ID"
          latest=true
          [[ "$VERSION" != *-* ]] || latest=false
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

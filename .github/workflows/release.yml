name: Build & release

# Push a tag like v1.0.1 to build the Mac and Windows apps and publish a release.
# "Run workflow" on the Actions tab builds everything without publishing (a test build).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          for APP in "release/mac-arm64/Supertitle Cuer.app" "release/mac/Supertitle Cuer.app"; do
            codesign --verify --deep --strict "$APP"
            plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$APP/Contents/Info.plist" | grep -qx supertitles
            echo "::notice::$(basename "$(dirname "$APP")"): signature OK (ad-hoc), .supertitles registered, $(lipo -archs "$APP/Contents/MacOS/Supertitle Cuer")"
          done
          APP="release/mac-arm64/Supertitle Cuer.app"
          "$APP/Contents/MacOS/Supertitle Cuer" &
          sleep 20
          pgrep -f "Supertitle Cuer.app/Contents/MacOS" >/dev/null && echo "::notice::Mac app launched and kept running"
          pkill -f "Supertitle Cuer.app/Contents/MacOS" || true
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\supertitle-cuer\Supertitle Cuer.exe'
          if (!(Test-Path $app)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter *.exe | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }; throw "app not installed at $app" }
          $assoc = (Get-ItemProperty 'HKCU:\Software\Classes\.supertitles' -ErrorAction SilentlyContinue).'(default)'
          if (!$assoc) { throw '.supertitles not registered' }
          Write-Host "::notice::Windows installer OK: installed, .supertitles -> $assoc"
          $p = Start-Process $app -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw 'app exited early' }
          Write-Host '::notice::Windows app launched and kept running'
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:html
      - uses: actions/upload-artifact@v4
        with:
          name: app-html
          path: dist/Supertitle_Cuer.html
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, html]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: app-*
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ### Install

            **Mac (Homebrew)**
            ```
            brew install --cask poetic-pixie/tap/supertitle-cuer
            ```
            Or download the `.dmg` for your Mac (`arm64` = Apple Silicon M1/M2/M3/M4, `x64` = Intel), drag the app to Applications, then run once in Terminal:
            ```
            xattr -dr com.apple.quarantine "/Applications/Supertitle Cuer.app"
            ```

            **Windows**
            Download `Supertitle_Cuer-Setup-….exe` and run it. If Windows shows “Windows protected your PC”, click **More info → Run anyway**.

            **No install (any computer with Chrome)**
            Download `Supertitle_Cuer.html` and double-click it.
